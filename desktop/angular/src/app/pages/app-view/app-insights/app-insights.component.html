<div class="grid grid-cols-2 gap-2">
  <app-dashboard-widget i18n-label="@@ui.src.app.pages.app.view.app.insights.app.insights.component.1747e16337f9" label="Connections" style="min-height: 400px;">
    <sfng-netquery-line-chart [data]="connectionChart"></sfng-netquery-line-chart>
  </app-dashboard-widget>

  <app-dashboard-widget i18n-label="@@ui.src.app.pages.app.view.app.insights.app.insights.component.5de902a55bf1" label="Data Usage" beta="true" style="min-height: 400px;">
    <sfng-netquery-line-chart [config]="bwChartConfig" [data]="bandwidthChart"></sfng-netquery-line-chart>
  </app-dashboard-widget>

  <app-dashboard-widget i18n-label="@@ui.src.app.pages.app.view.app.insights.app.insights.component.3e3d5de99f89" label="Countries" beta="true" style="min-height: 400px">
    <sfng-netquery-circular-bar-chart class="block w-full h-full" [data]="countryData" [config]="countryBarConfig"></sfng-netquery-circular-bar-chart>
  </app-dashboard-widget>
