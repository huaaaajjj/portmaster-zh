<div class="content-wrapper">
  <caption><ng-container i18n="@@ui.src.app.shared.exit.screen.exit.screen.9b118c45d338">Tip</ng-container></caption>
  <fa-icon class="close-icon" icon="times" (click)="cancel()"></fa-icon>

  <h1><ng-container i18n="@@ui.src.app.shared.exit.screen.exit.screen.833cf36c731a">Close User Interface</ng-container></h1>

  <span class="message"><ng-container i18n="@@ui.src.app.shared.exit.screen.exit.screen.5b57ea14ba4b">Closing the User Interface does not shut down the Portmaster. You can shut down the Portmaster
    in the Settings or the Tray Notifier.</ng-container></span>

  <div class="actions">
    <span>
      <input name="neveragain" id="neveragain" [(ngModel)]="neveragain" type="checkbox"> <label for="neveragain"><ng-container i18n="@@ui.src.app.shared.exit.screen.exit.screen.c3f4f1d113d0">Never
        Show
        Again</ng-container></label>
    </span>

    <button (click)="closeUI()" type="button"><ng-container i18n="@@ui.src.app.shared.exit.screen.exit.screen.7dbe54838136">Close UI</ng-container></button>
  </div>
</div>
