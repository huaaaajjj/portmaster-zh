  <!-- What's new on the SPN -->
  <div class="flex items-center mb-4 justify-items-center w-80">
    <h4 class="mr-4"><ng-container i18n="@@ui.src.app.shared.spn.network.status.spn.network.status.5402ac550489">Network Status</ng-container></h4>
    <span class="flex-grow inline-block border-b border-buttons-light"></span>
  </div>

  <span class="text-secondary" *ngIf="!spnIssues.length"><ng-container i18n="@@ui.src.app.shared.spn.network.status.spn.network.status.301f1cb0bd99">Loading Network Status ...</ng-container></span>
  <div class="issue-list">
    <ul [@fadeInList]="spnIssues.slice(0, 8).length">
      <li *ngFor="let issue of spnIssues.slice(0, 8); trackBy: trackIssue" (click)="issue.expanded = !issue.expanded"
        class="issue" [class.expanded]="issue.expanded">
        <div class="header">
          <span class="title">{{ issue.title }}</span>
          <span class="meta" i18n="@@spn.issueMeta">{issue.closed, select, true {closed} other {opened}} by <u>{{ issue.user }}</u> {{ issue.createdAt | timeAgo }}</span>
        </div>
        <fa-icon [icon]="issue.expanded ? 'chevron-up' : 'chevron-down'"></fa-icon>
        <div class="body" *ngIf="issue.expanded">
          <markdown emoji [data]="issue.body"></markdown>
          <div>
            <a class="underline text-primary" (click)="openIssue(issue)"><ng-container i18n="@@ui.src.app.shared.spn.network.status.spn.network.status.bc2c269fa8fe">Open on Github</ng-container></a>
          </div>
        </div>
      </li>
    </ul>
  </div>
